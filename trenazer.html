<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#1f1e1c;--ink2:#55544f;--line:#e2e0d8;--accent:#2a78d6;--bad:#c4332f;color-scheme:light}

label{display:block;font-size:14px;color:var(--ink2);margin-bottom:4px}

input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;margin-top:12px;padding:9px 18px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait} .err{color:var(--bad);min-height:1.5em;margin:.6em 0 0}
footer{margin-top:22px;font-size:13px;color:var(--ink2);text-align:center}
